# XcodeGen spec — generates ClosetScanner.xcodeproj from the source folders.
# On the Mac:  brew install xcodegen  &&  xcodegen generate  &&  open ClosetScanner.xcodeproj
name: ClosetScanner
options:
  bundleIdPrefix: com.skirozik
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"      # iPhone + iPad (both run on LiDAR Pro devices)
targets:
  ClosetScanner:
    type: application
    platform: iOS
    sources:
      - path: ClosetScanner
        excludes:
          - "Info.plist"               # using generated Info.plist (keys below)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skirozik.closetscanner
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "ClosetScanner uses the camera and LiDAR to scan the closet and measure its dimensions."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  ClosetScannerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ClosetScannerTests
    dependencies:
      - target: ClosetScanner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skirozik.closetscannerTests
        GENERATE_INFOPLIST_FILE: YES
